projects:
  - name: DeployPrueba
    environments:
      - name: Production
        services:
          - type: web
            name: PaqTrackerDeploy
            runtime: docker
            repo: https://github.com/VictorJJSJR/PaqTrackerDeploy.git
            branch: main
            region: oregon
            plan: free
            dockerfilePath: ./PAQTERIA.Server/Dockerfile
            dockerContext: .
            healthCheckPath: /
            envVars:
              - key: ASPNETCORE_ENVIRONMENT
                value: Production
              - key: PORT
                value: "10000"
              - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
                value: "true"
              - key: ConnectionStrings__DefaultConnection
                sync: false
